name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The released reference Reader and tools this corpus is checked against. Pins are release
# tags, or commits while a Spec Change Proposal is in flight; never a branch (CONTRIBUTING.md).
env:
  MOCA_READER_TYPESCRIPT_REF: 0f5256c50e8e46321cb297b6c175cccefb700366  # release-0.7.0 (log.md heading fix merged); v0.7.0 once tagged
  MOCA_TOOLS_REF: e46d709ddb7f5802e60238cc78af2dd81b90744b  # release-0.7.0 (sigstore lock update); v0.7.0 once tagged

jobs:
  deps:
    name: Public dependencies only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node scripts/check-deps.mjs

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: moca-spec
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/moca-reader-typescript
          ref: ${{ env.MOCA_READER_TYPESCRIPT_REF }}
          path: moca-reader-typescript
          # Read access to the other MOCA repos while they are private.
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/moca-tools
          ref: ${{ env.MOCA_TOOLS_REF }}
          path: moca-tools
          # Read access to the other MOCA repos while they are private.
          token: ${{ secrets.MOCA_REPOS_TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '*/package-lock.json'
      - run: npm ci
        working-directory: moca-reader-typescript
      - run: npm ci
        working-directory: moca-tools
      - run: npm ci
        working-directory: moca-spec
      - run: npm run validate
        working-directory: moca-spec
