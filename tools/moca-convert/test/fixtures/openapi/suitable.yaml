openapi: 3.0.3
info:
  title: Widget API
  description: A small API for managing widgets.
  version: 1.0.0
paths:
  /widgets:
    get:
      operationId: listWidgets
      summary: List widgets
      description: Returns all widgets in the catalog.
      responses:
        '200':
          description: A list of widgets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Widget'
    post:
      operationId: createWidget
      summary: Create a widget
      description: Creates a new widget.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Widget'
      responses:
        '201':
          description: The created widget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
  /widgets/{id}:
    get:
      operationId: getWidget
      summary: Get a widget
      description: Returns a single widget by id.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The widget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
        '404':
          description: Not found.
components:
  schemas:
    Widget:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
